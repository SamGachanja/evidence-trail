name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Check installed command and templates outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          evidencetrail --help
          evidencetrail new INSTALL_SMOKE --tasks-dir evidence-smoke
          test -f evidence-smoke/INSTALL_SMOKE/task.json
          test -f evidence-smoke/INSTALL_SMOKE/review.json
