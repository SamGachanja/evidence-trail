[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "evidencetrail"
version = "0.1.0"
description = "Evidence-linked research packages, source audits, and version-bound independent reviews."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Samuel Gachanja"}]
dependencies = []
[project.scripts]
evidencetrail = "evidencetrail:main"
[tool.setuptools.packages.find]
include = ["evidencetrail*"]
[tool.setuptools.package-data]
evidencetrail = ["templates/*.json"]
